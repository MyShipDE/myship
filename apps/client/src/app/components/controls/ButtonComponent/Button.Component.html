<button (click)="click()" type="button" class="custom-btn" [ngClass]="ClassProperties"
        style="padding: 0">
  <div *ngIf="!core.isBusy" class="row height-auto" style="justify-content: center; align-items: center">
    <div *ngIf="icon != null">
      <img src="{{ icon }}" style="width: 100%; height: auto">
    </div>
    <div *ngIf="title != null" class="text">
      {{ title }}
    </div>
  </div>
  <div *ngIf="core.isBusy" class="row height-auto" style="justify-content: center; align-items: center">
    <div class="lds-ring">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
</button>
